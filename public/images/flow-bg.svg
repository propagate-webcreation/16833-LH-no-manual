<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1a23"/>
      <stop offset="100%" stop-color="#142737"/>
    </linearGradient>
    <radialGradient id="fb-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8c2a2a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8c2a2a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fb-grain" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.4" fill="#f4efe6" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#fb-bg)"/>
  <rect width="1600" height="900" fill="url(#fb-glow)"/>

  <g opacity="0.16" stroke="#f4efe6" stroke-width="1.5" fill="none">
    <circle cx="220" cy="450" r="60"/>
    <circle cx="600" cy="450" r="60"/>
    <circle cx="980" cy="450" r="60"/>
    <circle cx="1360" cy="450" r="60"/>
    <line x1="280" y1="450" x2="540" y2="450" stroke-dasharray="6 6"/>
    <line x1="660" y1="450" x2="920" y2="450" stroke-dasharray="6 6"/>
    <line x1="1040" y1="450" x2="1300" y2="450" stroke-dasharray="6 6"/>
  </g>
  <g opacity="0.3" fill="#f4efe6" font-family="Inter, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="220" y="458">01</text>
    <text x="600" y="458">02</text>
    <text x="980" y="458">03</text>
    <text x="1360" y="458">04</text>
  </g>

  <rect width="1600" height="900" fill="url(#fb-grain)"/>
</svg>
