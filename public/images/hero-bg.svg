      <stop offset="0%" stop-color="#0b1820"/>
      <stop offset="55%" stop-color="#11212d"/>
      <stop offset="100%" stop-color="#1a3140"/>
    </linearGradient>
    <linearGradient id="hb-mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3344"/>
      <stop offset="100%" stop-color="#0e1d27"/>
