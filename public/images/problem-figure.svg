<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2c38"/>
      <stop offset="100%" stop-color="#0c1820"/>
    </linearGradient>
    <linearGradient id="pf-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4a36"/>
      <stop offset="100%" stop-color="#3a2e20"/>
    </linearGradient>
    <radialGradient id="pf-lamp" cx="75%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#f4d99a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#f4d99a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f4d99a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pf-grain" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.4" fill="#f4efe6" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="600" height="750" fill="url(#pf-bg)"/>
  <rect width="600" height="750" fill="url(#pf-lamp)"/>

  <!-- Window frame back -->
  <g opacity="0.18" stroke="#f4efe6" fill="none">
    <rect x="60" y="80" width="180" height="240"/>
    <line x1="150" y1="80" x2="150" y2="320"/>
    <line x1="60" y1="200" x2="240" y2="200"/>
  </g>

  <!-- Desk -->
  <rect x="0" y="500" width="600" height="250" fill="url(#pf-desk)"/>
  <rect x="0" y="500" width="600" height="6" fill="#f4efe6" fill-opacity="0.1"/>

  <!-- Stack of papers (large pile) -->
  <g transform="translate(80 460)">
    <rect x="0" y="0" width="200" height="44" fill="#f4efe6" fill-opacity="0.92" stroke="#11212d" stroke-opacity="0.3"/>
    <rect x="-4" y="-8" width="200" height="44" fill="#e6dcc6" fill-opacity="0.92" stroke="#11212d" stroke-opacity="0.3"/>
    <rect x="2" y="-16" width="200" height="44" fill="#f4efe6" fill-opacity="0.92" stroke="#11212d" stroke-opacity="0.3"/>
    <rect x="-2" y="-24" width="200" height="44" fill="#e6dcc6" fill-opacity="0.92" stroke="#11212d" stroke-opacity="0.3"/>
    <rect x="4" y="-32" width="200" height="44" fill="#f4efe6" fill-opacity="0.92" stroke="#11212d" stroke-opacity="0.3"/>
    <line x1="10" y1="-22" x2="180" y2="-22" stroke="#11212d" stroke-opacity="0.4"/>
    <line x1="10" y1="-12" x2="160" y2="-12" stroke="#11212d" stroke-opacity="0.4"/>
    <line x1="10" y1="-2" x2="170" y2="-2" stroke="#11212d" stroke-opacity="0.4"/>
  </g>

  <!-- Open document on right -->
  <g transform="translate(320 480) rotate(-3)">
    <rect x="0" y="0" width="220" height="160" fill="#f4efe6" fill-opacity="0.95" stroke="#11212d" stroke-opacity="0.35"/>
    <rect x="14" y="14" width="100" height="8" fill="#11212d" fill-opacity="0.7"/>
    <line x1="14" y1="36" x2="200" y2="36" stroke="#11212d" stroke-opacity="0.3"/>
    <line x1="14" y1="50" x2="180" y2="50" stroke="#11212d" stroke-opacity="0.3"/>
    <line x1="14" y1="64" x2="190" y2="64" stroke="#11212d" stroke-opacity="0.3"/>
    <line x1="14" y1="78" x2="170" y2="78" stroke="#11212d" stroke-opacity="0.3"/>
    <line x1="14" y1="92" x2="190" y2="92" stroke="#11212d" stroke-opacity="0.3"/>
    <line x1="14" y1="106" x2="160" y2="106" stroke="#11212d" stroke-opacity="0.3"/>
    <rect x="140" y="120" width="60" height="28" fill="#8c2a2a" fill-opacity="0.85"/>
  </g>

  <!-- Lamp -->
  <g transform="translate(440 200)" opacity="0.85">
    <line x1="0" y1="320" x2="0" y2="120" stroke="#11212d" stroke-width="3"/>
    <path d="M-40 80 L40 80 L20 130 L-20 130 Z" fill="#11212d" stroke="#f4efe6" stroke-opacity="0.2"/>
    <circle cx="0" cy="135" r="14" fill="#f4d99a" fill-opacity="0.85"/>
  </g>

  <!-- Person silhouette (back view, working) -->
  <g transform="translate(160 360)">
    <ellipse cx="0" cy="0" rx="48" ry="42" fill="#11212d"/>
    <path d="M-70 40 Q-60 130 -50 200 L50 200 Q60 130 70 40 Q40 60 0 60 Q-40 60 -70 40 Z" fill="#11212d"/>
  </g>

  <!-- Title text overlay -->
  <g transform="translate(40 60)" font-family="Inter, sans-serif" fill="#f4efe6" fill-opacity="0.7">
    <text font-size="11" letter-spacing="2.4">DESKWORK / NIGHT</text>
  </g>

  <rect width="600" height="750" fill="url(#pf-grain)"/>
</svg>
